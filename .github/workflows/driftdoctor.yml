name: driftdoctor-measurement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driftdoctor-measurement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dbt benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull shared comparison model
        run: ollama pull qwen2.5-coder:1.5b
      - name: Validate frozen benchmark
        run: python scripts/validate_benchmark.py
      - name: Measure DriftDoctor
        run: python scripts/run_driftdoctor.py --model qwen2.5-coder:1.5b --max-model-calls 14 --max-retries 2
      - name: Build DriftDoctor report
        run: python scripts/summarize_driftdoctor.py benchmark/results/driftdoctor
      - name: Upload complete DriftDoctor evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: driftdoctor-v0.1-qwen2.5-coder-1.5b
          path: benchmark/results/driftdoctor/
          if-no-files-found: warn
          retention-days: 30
