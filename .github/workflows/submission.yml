name: submission-preflight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submission-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install benchmark dependencies once
        run: python -m pip install -r requirements.txt
      - name: Validate benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Audit submission package
        run: python scripts/submission_preflight.py
      - name: Smoke broken and reference-repaired fixtures
        run: python scripts/smoke_benchmark.py --timeout 90
