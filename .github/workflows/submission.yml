name: submission-preflight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Validate benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Audit submission package
        run: python scripts/submission_preflight.py
