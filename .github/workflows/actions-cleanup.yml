name: actions-cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/actions-cleanup.yml"
  workflow_dispatch:
    inputs:
      keep_run_id:
        description: "Optional workflow run ID to preserve"
        required: false
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-cleanup-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete active workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          KEEP_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_run_id || '33245124108' }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          keep_raw = os.environ.get("KEEP_RUN_ID", "").strip()
          keep_run = int(keep_raw) if keep_raw else None
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "driftdoctor-actions-cleanup",
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def post(url: str) -> int:
              request = urllib.request.Request(url, headers=headers, data=b"", method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as exc:
                  return exc.code

          cancelled = []
          skipped = []
          for status in ("in_progress", "queued", "requested", "waiting", "pending"):
              data = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100"
              )
              for run in data.get("workflow_runs", []):
                  run_id = int(run["id"])
                  if run_id in {current_run, keep_run}:
                      continue
                  code = post(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel")
                  if code == 202:
                      cancelled.append(run_id)
                      continue
                  force_code = None
                  if code in (409, 422):
                      force_code = post(
                          f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/force-cancel"
                      )
                      if force_code == 202:
                          cancelled.append(run_id)
                          continue
                  skipped.append((run_id, code, force_code))

          print(json.dumps({"kept": keep_run, "cancelled": cancelled, "skipped": skipped}, sort_keys=True))
          if skipped:
              raise SystemExit(1)
          PY
