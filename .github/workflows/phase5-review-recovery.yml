name: phase5-review-recovery

on:
  pull_request:
    paths:
      - "driftdoctor/v2.py"
      - "scripts/run_phase5.py"
      - "scripts/aggregate_phase5.py"
      - ".github/workflows/phase5-review-recovery.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  OLLAMA_RESPONSE_TIMEOUT_SECONDS: "1200"

jobs:
  review-case:
    strategy:
      fail-fast: false
      matrix:
        case:
          - DD-001
          - DD-002
          - DD-003
          - DD-004
          - DD-005
          - DD-006
          - DD-007
          - DD-008
          - DD-009
          - DD-010
          - DD-011
          - DD-012
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install dbt benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull shared model
        run: ollama pull qwen2.5-coder:1.5b
      - name: Validate frozen benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Run semantic-review case
        run: >-
          python scripts/run_phase5.py
          --system driftdoctor-review
          --model qwen2.5-coder:1.5b
          --max-calls 14
          --case ${{ matrix.case }}
      - name: Upload raw case evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-review-case-${{ matrix.case }}
          path: benchmark/results/phase5/driftdoctor-review/${{ matrix.case }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate-review:
    if: always()
    needs: review-case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all review case artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: phase5-review-case-*
          path: benchmark/results/phase5/review-collected
          merge-multiple: true
      - name: Aggregate and validate all 12 cases
        run: |
          mkdir -p benchmark/results/phase5/driftdoctor-review-final
          python scripts/aggregate_phase5.py \
            --system driftdoctor-review \
            --input-root benchmark/results/phase5/review-collected \
            --output benchmark/results/phase5/driftdoctor-review-final/summary.json \
            --transport-timeout-seconds 1200 \
            --execution-mode distributed-case-matrix
          cp benchmark/results/phase5/review-collected/DD-*.json benchmark/results/phase5/driftdoctor-review-final/
      - name: Upload complete semantic-review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-driftdoctor-review-complete-qwen2.5-coder-1.5b
          path: benchmark/results/phase5/driftdoctor-review-final/
          if-no-files-found: error
          retention-days: 30
