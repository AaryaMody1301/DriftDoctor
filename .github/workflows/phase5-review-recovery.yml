name: phase5-review-fast

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-review-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  OLLAMA_RESPONSE_TIMEOUT_SECONDS: "1200"
  OLLAMA_KEEP_ALIVE: "-1"
  OLLAMA_VERSION: "0.33.2"

jobs:
  review-shard:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: a
            cases: "DD-001 DD-002 DD-003 DD-004"
          - shard: b
            cases: "DD-005 DD-006 DD-007 DD-008"
          - shard: c
            cases: "DD-009 DD-010 DD-011 DD-012"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install dbt benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Install pinned Ollama runtime
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="${OLLAMA_VERSION}" sh
      - name: Record Ollama version
        run: ollama --version
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull and preload shared model once per shard
        run: |
          ollama pull qwen2.5-coder:1.5b
          ollama list
          ollama run qwen2.5-coder:1.5b ""
      - name: Validate frozen benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Run four semantic-review cases on warm model
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p benchmark/results/phase5/review-shard
          status=0
          for case_id in ${{ matrix.cases }}; do
            echo "=== ${case_id} ==="
            if python scripts/run_phase5.py \
              --system driftdoctor-review \
              --model qwen2.5-coder:1.5b \
              --max-calls 14 \
              --case "${case_id}"; then
              :
            else
              status=1
            fi
            if [ -f "benchmark/results/phase5/driftdoctor-review/${case_id}.json" ]; then
              cp "benchmark/results/phase5/driftdoctor-review/${case_id}.json" \
                "benchmark/results/phase5/review-shard/${case_id}.json"
            else
              status=1
            fi
          done
          exit "${status}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase5-review-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: benchmark/results/phase5/review-shard/DD-*.json
          if-no-files-found: error
          retention-days: 30

  aggregate-review:
    if: ${{ always() && !cancelled() }}
    needs: review-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download all shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: phase5-review-shard-*-${{ github.run_id }}
          path: benchmark/results/phase5/review-collected
          merge-multiple: true
      - name: Aggregate and require all 12 scored cases
        run: |
          mkdir -p benchmark/results/phase5/driftdoctor-review-final
          python scripts/aggregate_phase5.py \
            --system driftdoctor-review \
            --input-root benchmark/results/phase5/review-collected \
            --output benchmark/results/phase5/driftdoctor-review-final/summary.json \
            --transport-timeout-seconds 1200 \
            --execution-mode three-shard-warm-model
          cp benchmark/results/phase5/review-collected/DD-*.json benchmark/results/phase5/driftdoctor-review-final/
      - name: Upload complete semantic-review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase5-driftdoctor-review-complete-qwen2.5-coder-1.5b-${{ github.run_id }}
          path: benchmark/results/phase5/driftdoctor-review-final/
          if-no-files-found: error
          retention-days: 30
