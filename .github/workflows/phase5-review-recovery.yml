name: phase5-review-fast

on:
  pull_request:
    paths:
      - ".github/workflows/phase5-review-recovery.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: phase5-review-deadline-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  OLLAMA_RESPONSE_TIMEOUT_SECONDS: "1200"
  OLLAMA_KEEP_ALIVE: "-1"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete queued and in-progress workflow runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "driftdoctor-deadline-cleanup",
          }

          def get_json(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def post(url: str) -> int:
              request = urllib.request.Request(url, headers=headers, data=b"", method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status
              except urllib.error.HTTPError as exc:
                  return exc.code

          cancelled = []
          skipped = []
          for status in ("in_progress", "queued"):
              data = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs"
                  f"?status={status}&per_page=100"
              )
              for run in data.get("workflow_runs", []):
                  run_id = int(run["id"])
                  if run_id == current_run:
                      continue
                  code = post(
                      f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel"
                  )
                  if code == 202:
                      cancelled.append(run_id)
                      continue
                  if code in (409, 422):
                      force_code = post(
                          f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/force-cancel"
                      )
                      if force_code == 202:
                          cancelled.append(run_id)
                          continue
                      skipped.append((run_id, code, force_code))
                  else:
                      skipped.append((run_id, code, None))

          print(json.dumps({"cancelled": cancelled, "skipped": skipped}, sort_keys=True))
          PY

  review-shard:
    needs: cleanup
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - shard: a
            cases: "DD-001 DD-002 DD-003 DD-004"
          - shard: b
            cases: "DD-005 DD-006 DD-007 DD-008"
          - shard: c
            cases: "DD-009 DD-010 DD-011 DD-012"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install dbt benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull and preload shared model once per shard
        run: |
          ollama pull qwen2.5-coder:1.5b
          ollama run qwen2.5-coder:1.5b ""
      - name: Validate frozen benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Run four semantic-review cases on warm model
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p benchmark/results/phase5/review-shard
          status=0
          for case_id in ${{ matrix.cases }}; do
            echo "=== ${case_id} ==="
            if python scripts/run_phase5.py \
              --system driftdoctor-review \
              --model qwen2.5-coder:1.5b \
              --max-calls 14 \
              --case "${case_id}"; then
              :
            else
              status=1
            fi
            if [ -f "benchmark/results/phase5/driftdoctor-review/${case_id}.json" ]; then
              cp "benchmark/results/phase5/driftdoctor-review/${case_id}.json" \
                "benchmark/results/phase5/review-shard/${case_id}.json"
            else
              status=1
            fi
          done
          exit "${status}"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-review-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: benchmark/results/phase5/review-shard/DD-*.json
          if-no-files-found: error
          retention-days: 30

  aggregate-review:
    if: always()
    needs: review-shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download all shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: phase5-review-shard-*-${{ github.run_id }}
          path: benchmark/results/phase5/review-collected
          merge-multiple: true
      - name: Aggregate and require all 12 scored cases
        run: |
          mkdir -p benchmark/results/phase5/driftdoctor-review-final
          python scripts/aggregate_phase5.py \
            --system driftdoctor-review \
            --input-root benchmark/results/phase5/review-collected \
            --output benchmark/results/phase5/driftdoctor-review-final/summary.json \
            --transport-timeout-seconds 1200 \
            --execution-mode three-shard-warm-model
          cp benchmark/results/phase5/review-collected/DD-*.json benchmark/results/phase5/driftdoctor-review-final/
      - name: Upload complete semantic-review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-driftdoctor-review-complete-qwen2.5-coder-1.5b-${{ github.run_id }}
          path: benchmark/results/phase5/driftdoctor-review-final/
          if-no-files-found: error
          retention-days: 30
