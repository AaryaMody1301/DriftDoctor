name: baseline-measurement

on:
  pull_request:
    paths:
      - "baseline/**"
      - "benchmark/**"
      - "scripts/run_baseline.py"
      - "scripts/summarize_baseline.py"
      - "requirements.txt"
      - ".github/workflows/baseline.yml"
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dbt benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull baseline model
        run: ollama pull qwen2.5-coder:1.5b
      - name: Validate benchmark
        run: python scripts/validate_benchmark.py
      - name: Measure frozen baseline
        run: python scripts/run_baseline.py --model qwen2.5-coder:1.5b --max-steps 14
      - name: Build baseline report
        run: python scripts/summarize_baseline.py benchmark/results/baseline
      - name: Upload complete baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-v0.1-qwen2.5-coder-1.5b
          path: benchmark/results/baseline/
          if-no-files-found: warn
          retention-days: 30
