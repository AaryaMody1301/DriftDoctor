name: phase5-experiments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-experiments-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  OLLAMA_VERSION: "0.33.2"

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        system:
          - context-baseline
          - driftdoctor-no-review
          - driftdoctor-review
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install dbt benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Install pinned Ollama runtime
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="${OLLAMA_VERSION}" sh
      - name: Record Ollama version
        run: ollama --version
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull shared model and record identity
        run: |
          ollama pull qwen2.5-coder:1.5b
          ollama list
      - name: Validate frozen benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Run controlled experiment
        run: python scripts/run_phase5.py --system ${{ matrix.system }} --model qwen2.5-coder:1.5b --max-calls 14
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase5-${{ matrix.system }}-qwen2.5-coder-1.5b-${{ github.run_id }}
          path: benchmark/results/phase5/${{ matrix.system }}/
          if-no-files-found: warn
          retention-days: 30
