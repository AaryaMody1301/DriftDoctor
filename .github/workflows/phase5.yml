name: phase5-experiments

on:
  pull_request:
    paths:
      - "benchmark/**"
      - "baseline/**"
      - "driftdoctor/**"
      - "scripts/run_phase5.py"
      - ".github/workflows/phase5.yml"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        system:
          - context-baseline
          - driftdoctor-no-review
          - driftdoctor-review
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dbt benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull shared model
        run: ollama pull qwen2.5-coder:1.5b
      - name: Validate frozen benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Run controlled experiment
        run: python scripts/run_phase5.py --system ${{ matrix.system }} --model qwen2.5-coder:1.5b --max-calls 14
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-${{ matrix.system }}-qwen2.5-coder-1.5b
          path: benchmark/results/phase5/${{ matrix.system }}/
          if-no-files-found: warn
          retention-days: 30
