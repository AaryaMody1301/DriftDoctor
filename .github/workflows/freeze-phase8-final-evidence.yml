name: freeze-phase8-final-evidence

on:
  push:
    branches:
      - phase-8-hybrid-repair-skills
    paths:
      - ".github/workflows/freeze-phase8-final-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: phase-8-hybrid-repair-skills
      - name: Download corrected Phase 8 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf evidence/phase8 /tmp/phase8-skills /tmp/phase8-hybrid /tmp/skills.zip /tmp/hybrid.zip
          mkdir -p evidence/phase8/skills-only evidence/phase8/hybrid /tmp/phase8-skills /tmp/phase8-hybrid
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/9716167164/zip" \
            -o /tmp/skills.zip
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/9716167394/zip" \
            -o /tmp/hybrid.zip
          unzip -q /tmp/skills.zip -d /tmp/phase8-skills
          unzip -q /tmp/hybrid.zip -d /tmp/phase8-hybrid
          cp /tmp/phase8-skills/DD-*.json /tmp/phase8-skills/summary.json evidence/phase8/skills-only/
          cp /tmp/phase8-hybrid/DD-*.json /tmp/phase8-hybrid/summary.json evidence/phase8/hybrid/
      - name: Verify both corrected result sets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expectations = {
              'skills-only': ('driftdoctor-v4-skills-only', 7.066),
              'hybrid': ('driftdoctor-v4-hybrid', 6.9895),
          }
          for folder, (system, expected_time) in expectations.items():
              root = Path('evidence/phase8') / folder
              summary = json.loads((root / 'summary.json').read_text())
              cases = sorted(root.glob('DD-*.json'))
              assert len(cases) == 12, (folder, len(cases))
              assert summary['system'] == system
              assert summary['complete'] is True
              assert summary['expected_cases'] == 12
              assert summary['scored_cases'] == 12
              assert summary['solved'] == 12
              assert summary['verified_resolution_rate'] == 1.0
              assert summary['root_cause_correct'] == 12
              assert summary['root_cause_accuracy'] == 1.0
              assert summary['fallback_cases'] == 0
              assert summary['mean_model_calls'] == 0.0
              assert not summary['infrastructure_errors']
              assert abs(summary['mean_elapsed_seconds'] - expected_time) < 1e-9
              for path in cases:
                  data = json.loads(path.read_text())
                  assert data['passed'] is True, path
                  assert data['root_cause_correct'] is True, path
                  assert data['model_calls'] == 0, path
                  assert data['fallback_used'] is False, path
          PY
      - name: Write final evidence provenance
        run: |
          cat > evidence/phase8/manifest.json <<'EOF'
          {
            "workflow_run_id": 33257030328,
            "evaluation_head_sha": "0c6cf9b42863db4f45a94add11509988bcaa7815",
            "context_version": "0.2",
            "selected_system": "driftdoctor-v4-hybrid",
            "expected_cases": 12,
            "scored_cases": 12,
            "verified_resolution_rate": 1.0,
            "root_cause_accuracy": 1.0,
            "fallback_cases": 0,
            "mean_model_calls": 0.0,
            "mean_elapsed_seconds": 6.9895,
            "skills_only_ablation": {
              "artifact_id": 9716167164,
              "artifact_name": "phase8-skills-only-33257030328",
              "artifact_digest": "sha256:404a8d60b1134ed78072421e5710ea1c0e8f19a4d15b4779e61f9c422201c030",
              "verified_resolution_rate": 1.0,
              "root_cause_accuracy": 1.0,
              "mean_model_calls": 0.0,
              "mean_elapsed_seconds": 7.066
            },
            "hybrid_final": {
              "artifact_id": 9716167394,
              "artifact_name": "phase8-hybrid-33257030328",
              "artifact_digest": "sha256:b6788eb6ed860c339daf3c822639bfde9e759457c7ac9b7825d9a5e6da3ee030",
              "verified_resolution_rate": 1.0,
              "root_cause_accuracy": 1.0,
              "fallback_cases": 0,
              "mean_model_calls": 0.0,
              "mean_elapsed_seconds": 6.9895
            }
          }
          EOF
          cat > evidence/phase8/README.md <<'EOF'
          # Phase 8 final evidence

          This directory preserves the complete corrected Phase 8 evaluation from workflow run `33257030328` at repair-code SHA `0c6cf9b42863db4f45a94add11509988bcaa7815`.

          ## Final hybrid entry point

          - System: `driftdoctor-v4-hybrid`
          - Frozen benchmark/context: v0.2, 12 cases including DD-012 challenge case
          - Result: **12/12 verified repairs (100% VRR)**
          - Root-cause accuracy: **12/12 (100%)**
          - Infrastructure errors: **0**
          - Fallback cases: **0**
          - Mean model calls: **0.0**
          - Mean elapsed time: **6.9895s/case**
          - Artifact ID: `9716167394`
          - Artifact digest: `sha256:b6788eb6ed860c339daf3c822639bfde9e759457c7ac9b7825d9a5e6da3ee030`

          All 12 declared benchmark cases matched high-confidence deterministic repair skills, so the hybrid product did not invoke its local-model fallback in this run. That is a resource/result fact for this benchmark, not a claim that arbitrary dbt incidents never require model reasoning.

          ## Skills-only ablation

          `skills-only/` is the no-fallback ablation from the same workflow run. It also scored 12/12 with 0 model calls and averaged 7.066s/case. Its artifact ID is `9716167164` with digest `sha256:404a8d60b1134ed78072421e5710ea1c0e8f19a4d15b4779e61f9c422201c030`.

          `hybrid/` and `skills-only/` each contain all 12 raw case records plus `summary.json`. Case records include selected skills, diffs, dbt build evidence, external evaluator checks, timing, root-cause results, fallback usage, and model-call count.

          `tests/test_repair_skills.py` contains anti-leakage and mutation/generalization probes. The final corrected run passed all nine tests before either benchmark measurement executed.
          EOF
      - name: Remove one-shot workflow and commit evidence
        run: |
          rm .github/workflows/freeze-phase8-final-evidence.yml
          git config user.name "driftdoctor-evidence-bot"
          git config user.email "driftdoctor-evidence@users.noreply.github.com"
          git add evidence/phase8 .github/workflows/freeze-phase8-final-evidence.yml
          git commit -m "evidence: freeze corrected Phase 8 hybrid results"
          git push origin HEAD:phase-8-hybrid-repair-skills
