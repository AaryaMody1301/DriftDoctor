name: final-premerge

on:
  push:
    branches:
      - submission-finalization
    paths:
      - ".github/workflows/final-premerge.yml"

permissions:
  contents: write

concurrency:
  group: final-premerge-submission
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: submission-finalization
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/submission_preflight.py \
            scripts/run_incident.py \
            scripts/run_phase5.py \
            scripts/aggregate_phase5.py \
            driftdoctor/v2.py
      - name: Install pinned benchmark runtime
        run: python -m pip install -r requirements.txt
      - name: Validate frozen benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Validate final evidence and claims
        run: python scripts/submission_preflight.py
      - name: Smoke all broken and reference-repaired fixtures
        run: python scripts/smoke_benchmark.py --timeout 90
      - name: Remove one-shot workflow after success
        run: |
          git config user.name "DriftDoctor CI Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/final-premerge.yml
          git commit -m "ci: final premerge verification passed"
          git push origin HEAD:submission-finalization
