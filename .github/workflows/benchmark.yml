name: benchmark-smoke

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "benchmark/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements.txt
      - name: Versions
        run: |
          python --version
          dbt --version
          python -c "import duckdb; print('duckdb', duckdb.__version__)"
      - name: Validate benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Smoke all broken and reference-repaired fixtures
        run: python scripts/smoke_benchmark.py --timeout 90
