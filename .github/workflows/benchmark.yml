name: benchmark-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install -r requirements.txt
      - name: Versions
        run: |
          python --version
          dbt --version
          python -c "import duckdb; print('duckdb', duckdb.__version__)"
      - name: Validate benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Smoke all broken and reference-repaired fixtures
        run: python scripts/smoke_benchmark.py --timeout 90
