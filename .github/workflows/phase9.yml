name: phase9-selective-agency

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase9-selective-agency-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  OLLAMA_VERSION: "0.33.2"
  OLLAMA_RESPONSE_TIMEOUT_SECONDS: "900"

jobs:
  primary-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Run unit and integrity tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate benchmark contract
        run: python scripts/validate_benchmark.py
      - name: Measure strict final primary regression
        run: python scripts/run_phase9_primary.py
      - name: Upload primary regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: phase9-primary-regression-${{ github.run_id }}
          path: benchmark/results/phase9/primary-regression/
          if-no-files-found: warn
          retention-days: 30

  agent-trajectory:
    needs: primary-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.15"
          cache: pip
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Install pinned Ollama
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="${OLLAMA_VERSION}" sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull frozen comparison model
        run: |
          ollama pull qwen2.5-coder:1.5b
          ollama --version
          ollama list
      - name: Run held-out bounded-agent case
        run: python scripts/run_agent_fallback_demo.py --model qwen2.5-coder:1.5b
      - name: Upload representative agent trajectory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: phase9-agent-trajectory-${{ github.run_id }}
          path: benchmark/results/phase9/agent-fallback-demo.json
          if-no-files-found: warn
          retention-days: 30
